<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>Imersão RGT · Tráfego pago</title>
<style>/* DASHBOARD_CSS */</style>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.8/dist/chart.umd.min.js" defer></script>
</head>
<body>
<aside class="sidebar">
  <a class="brand" href="#geral"><span class="brand-mark">R</span><span><strong>Imersão RGT</strong><small>Controle de tráfego</small></span></a>
  <nav aria-label="Navegação do dashboard">
    <a href="#geral">Visão geral</a>
    <a href="#meta">Meta Ads</a>
    <a href="#relatorio">Relatório</a>
  </nav>
  <span class="side-foot">Fonte · Google Sheets</span>
</aside>
<main>
  <header>
    <div><p class="eyebrow">IMERSAO</p><h1 id="page-title">Visão geral</h1></div>
    <div class="update"><span id="updated"></span><button id="refresh" type="button">Buscar atualização</button></div>
  </header>
  <p id="refresh-status" class="status" role="status" hidden></p>
  <form id="filters" class="filters" aria-label="Filtros do dashboard">
    <label>De<input id="start" type="date" required></label>
    <label>Até<input id="end" type="date" required></label>
    <label id="campaign-filter">Campanha<select id="campaign"><option value="">Todas as campanhas</option></select></label>
    <button type="button" id="reset" class="subtle">Limpar filtros</button>
  </form>
  <div id="metrics" class="metrics" aria-label="Indicadores principais"></div>
  <div id="overview">
    <div class="section-grid">
      <section class="panel"><h2>Funil</h2><p id="funnel-note" class="note"></p><div id="funnel"></div></section>
      <section class="panel"><h2>Evolução diária</h2><p class="note" id="chart-note"></p><div class="chart"><canvas id="trend" role="img" aria-label="Gráfico diário de gasto, receita e pedidos pagos"></canvas><p id="chart-fallback" hidden>Os valores estão disponíveis no Relatório.</p></div></section>
    </div>
    <section id="secondary" class="panel"><h2 id="secondary-title"></h2><p id="secondary-note" class="note"></p><div class="table-scroll"><table id="secondary-table"></table></div></section>
  </div>
  <section id="report" class="panel" hidden><h2>Resultados por dia</h2><p class="note">As vendas incluem todas as origens. As etapas de tráfego vêm do Meta Ads.</p><div class="table-scroll"><table id="daily"></table></div></section>
</main>
<script type="application/json" id="dashboard-data"><!-- DASHBOARD_DATA --></script>
<script>/* DASHBOARD_JS */</script>
</body>
</html>
