name: Atualizar dashboard

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Validar atribuição de vendas
        run: python3 -m unittest discover -s tests -v
      - name: Gerar dashboard com os dados atualizados
        env:
          META_SHEET_ID: ${{ vars.META_SHEET_ID }}
          META_GID: ${{ vars.META_GID }}
          SALES_SHEET_ID: ${{ vars.SALES_SHEET_ID }}
          SALES_GID: ${{ vars.SALES_GID }}
        run: python3 scripts/build.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
